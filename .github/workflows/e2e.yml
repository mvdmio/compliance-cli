# The E2E suite, nightly: the CLI from HEAD against a Test-bed built from mvdmio-suite master.
# A failed scheduled run notifies through GitHub's default notification for scheduled runs, which goes to the
# user who last changed the cron line.
# The MVDMIO_SUITE_DEPLOY_KEY secret is the private half of the read-only deploy key "compliance-cli E2E (read-only)"
# on mvdmio-suite, set up once by a person. GitHub turns the schedule off after 60 days without repository activity;
# re-enable it in the Actions tab.

name: E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      MVDMIO_SUITE_DIR: ${{ github.workspace }}/mvdmio-suite
    steps:
      - name: Check the MVDMIO_SUITE_DEPLOY_KEY secret
        env:
          MVDMIO_SUITE_DEPLOY_KEY: ${{ secrets.MVDMIO_SUITE_DEPLOY_KEY }}
        run: |
          if [ -z "$MVDMIO_SUITE_DEPLOY_KEY" ]; then
            echo "::error::The MVDMIO_SUITE_DEPLOY_KEY secret is not set: add the private half of a read-only deploy key on mvdmio-suite."
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Check out mvdmio-suite
        uses: actions/checkout@v6
        with:
          repository: michielvandermeer/mvdmio-suite
          ref: master
          ssh-key: ${{ secrets.MVDMIO_SUITE_DEPLOY_KEY }}
          path: mvdmio-suite
          lfs: false
      # mvdmio-suite pins no SDK; its Web project targets net10.0.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # The Compliance build runs `bun install` and `bun build`.
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      # The suite starts the Test-bed through scripts/test-bed.sh; Docker is already on the runner.
      - run: cargo test --test e2e -- --ignored
      - name: Upload the timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timing
          path: target/e2e/
          if-no-files-found: warn
