[package]
name = "compliance-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line tool for the Compliance REST API, built for people and their Agents."
license = "MIT"
repository = "https://github.com/mvdmio/compliance-cli"
readme = "README.md"

[[bin]]
name = "compliance"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
httpdate = "1.0.3"
open = "5.4.4"
percent-encoding = "2.3.2"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
