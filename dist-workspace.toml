[workspace]
members = ["cargo:."]

[dist]
# The dist version CI installs (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# $CARGO_HOME/bin, else ~/.cargo/bin
install-path = "CARGO_HOME"
hosting = "github"
# No self-update: users upgrade by running the install line again
install-updater = false
# Build releases only for a pushed version tag, never for a pull request
pr-run-mode = "skip"
